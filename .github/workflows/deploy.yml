# Publica la carpeta site/ en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otro push, la que está en curso termina igual
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Revisar enlaces internos
        run: |
          # Falla si index.html enlaza un archivo local que no existe
          missing=0
          for ref in $(grep -oE '(href|src)="[^"#:]+"' site/index.html | sed -E 's/^(href|src)="//; s/"$//'); do
            [ -e "site/$ref" ] || { echo "Falta: $ref"; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
